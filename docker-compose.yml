# ==============================================================================
# Mini Project 01: E-Commerce Data Engineering Pipeline
# Infrastructure Stack: RabbitMQ, MongoDB, PostgreSQL, Elasticsearch,
#                       Apache NiFi, and Apache Airflow (LocalExecutor)
# ==============================================================================

networks:
  ecommerce-network:
    name: ecommerce-network
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. Message Broker: RabbitMQ
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"         # AMQP protocol
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 2. Structured Storage: PostgreSQL (Transactional and Airflow Metadata)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Raw Storage: MongoDB (JSON Document Store for Raw Ingested Orders)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: ecommerce_mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongopassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-ecommerce}
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. Search and Analytics: Elasticsearch (Single-Node Configuration)
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: elasticsearch:8.13.4
    container_name: ecommerce_elasticsearch
    restart: unless-stopped
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "9300:9300"
    environment:
      - node.name=es01
      - cluster.name=ecommerce-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  
  # ----------------------------------------------------------------------------
  # Kibana: Elasticsearch Visualization and Search UI
  # ----------------------------------------------------------------------------
  kibana:
    image: kibana:8.13.4
    container_name: ecommerce_kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - ecommerce-network


  # ----------------------------------------------------------------------------
  # 5. ETL and Data Routing: Apache NiFi
  # ----------------------------------------------------------------------------
  nifi:
    image: apache/nifi:1.26.0
    container_name: ecommerce_nifi
    hostname: nifi
    restart: unless-stopped
    ports:
      - "${NIFI_HTTPS_PORT:-8443}:8443"
    environment:
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_JVM_HEAP_INIT=512m
      - NIFI_JVM_HEAP_MAX=1024m
      - SINGLE_USER_CREDENTIALS_USERNAME=${NIFI_ADMIN_USER:-admin}
      - SINGLE_USER_CREDENTIALS_PASSWORD=${NIFI_ADMIN_PASSWORD:-AdminPassword123!}
      - NIFI_VARIABLE_REGISTRY_PROPERTIES=
    volumes:
      - ./nifi/drivers:/opt/nifi/nifi-current/drivers
      - ./nifi/exports:/opt/nifi/nifi-current/exports
      - nifi_database_repository:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content_repository:/opt/nifi/nifi-current/content_repository
      - nifi_provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "curl -k -s -o /dev/null -w \"%{http_code}\" https://$$HOSTNAME:8443/nifi/ | grep -qE \"200|302\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 60s

  # ----------------------------------------------------------------------------
  # 6. Orchestration DB Setup: Airflow Init (Runs migrations & creates admin)
  # ----------------------------------------------------------------------------
  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: ecommerce-airflow:2.9.1
    container_name: ecommerce_airflow_init
    command: init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${AIRFLOW_DB:-airflow}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW_ADMIN_USERNAME=${AIRFLOW_ADMIN_USERNAME:-admin}
      - AIRFLOW_ADMIN_PASSWORD=${AIRFLOW_ADMIN_PASSWORD:-admin}
      - AIRFLOW_ADMIN_EMAIL=${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks:
      - ecommerce-network

  # ----------------------------------------------------------------------------
  # 7. Orchestration: Apache Airflow Webserver
  # ----------------------------------------------------------------------------
  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: ecommerce-airflow:2.9.1
    container_name: ecommerce_airflow_webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${AIRFLOW_DB:-airflow}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY:-4686e72d99d79f4c176decab36ac72f3}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 8. Orchestration: Apache Airflow Scheduler
  # ----------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: ecommerce-airflow:2.9.1
    container_name: ecommerce_airflow_scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${AIRFLOW_DB:-airflow}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/reports
      - ./src:/opt/airflow/src
      - airflow_logs:/opt/airflow/logs
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# ==============================================================================
# Persistent Volumes Definition
# ==============================================================================
volumes:
  postgres_data:
    name: ecommerce_postgres_data
  mongodb_data:
    name: ecommerce_mongodb_data
  rabbitmq_data:
    name: ecommerce_rabbitmq_data
  elasticsearch_data:
    name: ecommerce_elasticsearch_data
  nifi_database_repository:
    name: ecommerce_nifi_database_repository
  nifi_flowfile_repository:
    name: ecommerce_nifi_flowfile_repository
  nifi_content_repository:
    name: ecommerce_nifi_content_repository
  nifi_provenance_repository:
    name: ecommerce_nifi_provenance_repository
  nifi_state:
    name: ecommerce_nifi_state
  airflow_logs:
    name: ecommerce_airflow_logs
